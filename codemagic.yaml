workflows:
  ios-unsigned:
    name: iOS 未签名打包
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 生成 iOS 工程、安装依赖并构建
        script: |
          cd smoke_free_app
          flutter create . --org com.example --project-name smoke_free_app
          flutter packages pub get
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -qry ../smoke_free_app_unsigned.ipa Payload
    artifacts:
      - smoke_free_app/build/smoke_free_app_unsigned.ipa
