name: smoke_free_app
description: "熬过去 - 帮你撑过每一次烟瘾发作的戒烟助手"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 本地键值存储：存戒烟开始时间、烟价等设置
  shared_preferences: ^2.2.0
  # 本地 SQLite 数据库：存每天的吸烟支数记录
  sqflite: ^2.3.0
  # 数据库路径
  path: ^1.8.3
  # 状态管理：页面间共享戒烟数据
  provider: ^6.1.0
  # 本地通知：里程碑达成提醒（V1 含此功能）
  flutter_local_notifications: ^17.0.0
  # 时区支持：通知定时需要
  timezone: ^0.9.0
  # 日期格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
